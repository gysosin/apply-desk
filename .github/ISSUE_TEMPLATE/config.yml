blank_issues_enabled: true
contact_links:
  - name: Read this first if you work from a personal copy
    url: https://github.com/gysosin/apply-desk/blob/main/SETUP.md#2-fork-and-clone
    about: >-
      This tracker is public. Never paste your tracker rows, emails, CV text or
      config here. In your own clone run `gh repo set-default <you>/apply-desk`
      so the gh CLI keeps your automation pointed at your copy.
  - name: Security issue
    url: https://github.com/gysosin/apply-desk/security/advisories/new
    about: Report vulnerabilities privately, never in a public issue.
