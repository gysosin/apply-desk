# Router in front of Apply Desk. Host 443 -> 7443 (TLS), host 80 -> 7080 (redirect to https).
server {
    listen 7080;
    server_name applydesk.localhost;
    return 301 https://$host$request_uri;
}

server {
    listen 7443 ssl;
    http2 on;
    server_name applydesk.localhost localhost;

    ssl_certificate     /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    client_max_body_size 1m;

    location / {
        proxy_pass http://applydesk:8770;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 1h;
    }

    # live run logs (Server-Sent Events): no buffering
    location ~ ^/api/runs/[^/]+/stream$ {
        proxy_pass http://applydesk:8770;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
}
