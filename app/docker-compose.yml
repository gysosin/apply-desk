# Apply Desk in Docker: https://applydesk.localhost
#   docker compose -f app/docker-compose.yml up -d --build
# nginx is the only published service; the app is reachable only on the internal network.
# Claude access: either your Claude subscription login (~/.claude, mounted below) or an API key in app/.env
# (ANTHROPIC_API_KEY=... or CLAUDE_CODE_OAUTH_TOKEN=...). See docs/claude-access.md.
name: applydesk
services:
  applydesk:
    build: { context: .., dockerfile: app/Dockerfile }
    image: applydesk:latest
    restart: unless-stopped
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /workspace
    env_file: [{ path: .env, required: false }]
    environment:
      HOME: /home/app
      TZ: ${TZ:-UTC}
      APPLYDESK_CONTAINER: "1"
      CLAUDE_CONFIG_DIR: /home/app/.claude
      PATH: /opt/venv/bin:/home/app/.TinyTeX/bin/x86_64-linux:/home/app/.bun/bin:/usr/local/bin:/usr/bin:/bin
    command: ["python", "-m", "app", "serve", "--host", "0.0.0.0", "--port", "8770", "--behind-proxy"]
    expose: ["8770"]
    volumes:
      - ..:/workspace
      - ${HOME}/.TinyTeX:/home/app/.TinyTeX
      - ${HOME}/.bun:/home/app/.bun:ro
      - ${HOME}/.claude:/home/app/.claude          # Claude subscription login (token refresh writes here)
      - ${HOME}/.config/applydesk:/home/app/.config/applydesk
    # bubblewrap (the TeX sandbox) needs user namespaces: Docker's default seccomp profile plus only those syscalls.
    # label=disable avoids relabelling home dirs under SELinux.
    security_opt: [label=disable, "seccomp=./deploy/seccomp-bwrap.json"]
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://127.0.0.1:8770/"]
      interval: 60s
      timeout: 5s
      retries: 3

  router:
    image: nginx:1.29-alpine
    restart: unless-stopped
    depends_on: [applydesk]
    ports:
      - "127.0.0.1:443:7443"
      - "127.0.0.1:80:7080"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${HOME}/.config/applydesk-tls/server.crt:/etc/nginx/tls/server.crt:ro
      - ${HOME}/.config/applydesk-tls/server.key:/etc/nginx/tls/server.key:ro
    security_opt: [label=disable]
